<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" fill="none">
  <defs>
    <linearGradient id="ccnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#049fd9"/>
      <stop offset="100%" stop-color="#025875"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="360" height="120" rx="16" fill="#08031d" stroke="#049fd9" stroke-width="2"/>
  
  <!-- Cisco Cyan Bridge Mini -->
  <g fill="#049fd9" transform="translate(18, 28) scale(0.42)">
    <rect x="35" y="110" width="16" height="60" rx="8"/>
    <rect x="75" y="80" width="16" height="90" rx="8"/>
    <rect x="115" y="110" width="16" height="60" rx="8"/>
    <rect x="155" y="50" width="16" height="120" rx="8"/>
    <rect x="191" y="80" width="16" height="90" rx="8"/>
    <rect x="227" y="50" width="16" height="120" rx="8"/>
    <rect x="267" y="110" width="16" height="60" rx="8"/>
    <rect x="307" y="80" width="16" height="90" rx="8"/>
    <rect x="347" y="110" width="16" height="60" rx="8"/>
  </g>
  <text x="100" y="98" text-anchor="middle" fill="#049fd9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" letter-spacing="2">CISCO</text>

  <!-- Divider Line -->
  <line x1="185" y1="20" x2="185" y2="100" stroke="#7042f855" stroke-width="2"/>

  <!-- Certification Details -->
  <text x="200" y="48" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">CERTIFIED</text>
  <text x="200" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="2">CCNA</text>
  <text x="200" y="100" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" letter-spacing="0.5">Enterprise Networking &amp; Security</text>
</svg>
